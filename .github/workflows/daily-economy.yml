name: Daily settlement and rankings
on:
  push:
    branches: [main]
    paths: [ops/quote-policy-92-shares-v2.json]
  schedule:
    - cron: '55 22 * * *' # 07:55 Asia/Seoul
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'full: 정산·발각·이벤트·순위 / rankings-only: 순위 / spies-policy-only: 스파이 2명 정책 전환만'
        type: choice
        options:
          - signup-capital-correction
          - production-units-migrate
          - ranked-dividends-migrate
          - offering-audit
          - market-close
          - production-economy-initialize
          - price-limits-initialize
          - reverse-admin-meme-2026-10-21
          - correct-startup-settlement-2026-10-21
          - reset-preserve-presidents-2026-10-22
          - reset-2026-10-21
          - full
          - initial-capital-2000000
          - recovery-event-2026-10-21
          - rankings-only
          - spies-policy-only
        default: full
permissions:
  contents: read
  id-token: write
concurrency:
  group: daily-economy
  cancel-in-progress: false
jobs:
  settle:
    if: vars.ECONOMY_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.ECONOMY_WIF_PROVIDER }}
          service_account: ${{ vars.ECONOMY_SERVICE_ACCOUNT }}
      - run: node scripts/build-jobs.mjs
      - run: node .generated-scheduled-job.mjs
        env:
          FIREBASE_PROJECT_ID: hcujusik
          ECONOMY_JOB_MODE: ${{ github.event_name == 'push' && 'rankings-only' || inputs.mode || 'full' }}
